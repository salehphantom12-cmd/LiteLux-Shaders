# ============================================================================
#  Vanilla+ Lite  -  shaders.properties
# ============================================================================

# ---- Vanilla behaviour -----------------------------------------------------
oldLighting=false          # we do our own directional face shading
oldHandLight=false
separateAo=false
vignette=false             # vanilla vignette off, ours is softer
underwaterOverlay=true
sun=true
moon=true

# Vanilla clouds only when CLOUDS == 1 (procedural clouds replace them otherwise)
#if CLOUDS == 1
clouds=fancy
#else
clouds=off
#endif

# ---- Shadow pass workload --------------------------------------------------
# Translucents never cast shadows (water is discarded anyway).
shadowTranslucent=false
#if SHADOW_QUALITY == 0
program.shadow.enabled=false
shadowTerrain=false
shadowEntities=false
shadowBlockEntities=false
#elif SHADOW_QUALITY == 1
shadowBlockEntities=false
#endif

# ---- Presets ---------------------------------------------------------------
profile.LOW=SHADOW_QUALITY:0 SHADOW_SOFTNESS:1.0 SSAO:0 CLOUDS:2 CLOUD_QUALITY:0 BLOOM:0 WATER_REFLECTIONS:1 WATER_WAVES:0 VEGETATION_WIND:1 shadowMapResolution:512 shadowDistance:64.0
profile.MEDIUM=SHADOW_QUALITY:1 SHADOW_SOFTNESS:1.0 SSAO:1 CLOUDS:2 CLOUD_QUALITY:1 BLOOM:1 WATER_REFLECTIONS:1 WATER_WAVES:1 VEGETATION_WIND:1 shadowMapResolution:1024 shadowDistance:96.0
profile.HIGH=SHADOW_QUALITY:2 SHADOW_SOFTNESS:1.5 SSAO:2 CLOUDS:2 CLOUD_QUALITY:2 BLOOM:1 WATER_REFLECTIONS:1 WATER_WAVES:1 VEGETATION_WIND:1 shadowMapResolution:2048 shadowDistance:128.0

# ---- Settings menu ---------------------------------------------------------
screen=<profile> <empty> [LIGHTING] [ATMOSPHERE] [WATER] [POST]
screen.LIGHTING=SHADOW_QUALITY SHADOW_SOFTNESS shadowMapResolution shadowDistance sunPathRotation SSAO SSAO_STRENGTH TORCH_BRIGHTNESS MIN_LIGHT
screen.ATMOSPHERE=CLOUDS CLOUD_QUALITY FOG_DENSITY UNDERWATER_FOG VEGETATION_WIND WIND_STRENGTH
screen.WATER=WATER_REFLECTIONS WATER_WAVES
screen.POST=BLOOM BLOOM_STRENGTH COLOR_GRADING EXPOSURE SATURATION CONTRAST VIGNETTE
screen.columns=2

sliders=SHADOW_SOFTNESS SSAO_STRENGTH TORCH_BRIGHTNESS MIN_LIGHT FOG_DENSITY WIND_STRENGTH BLOOM_STRENGTH EXPOSURE SATURATION CONTRAST shadowMapResolution shadowDistance sunPathRotation
